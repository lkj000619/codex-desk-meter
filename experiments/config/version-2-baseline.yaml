schema_version: 2
experiment_id: version-2-end-to-end-v1

# This file describes the planned cohort. It is not an execution authorization.
readiness:
  status: planning
  execution_authorized: false
  authorization_owner: user
  require_explicit_run_approval: true
  prompt_delivery: runner_only
  manual_prompt_paste_allowed: false
  external_feedback_during_run: forbidden
  evaluator_writes_during_run: forbidden
  remediation_separate_from_original: true

scope:
  cohort: version-2-end-to-end-v1
  included_features: [F1, F2, F3, F4, F5, F6, F7, F8, F9]
  out_of_cohort_features: []
  out_of_cohort_status: "not_run; out of cohort"
  planned_product_cohort: version-2-end-to-end-v1
  future_live_cohort: version-2-live-integration-v1
  transport_choice: usb-serial-cdm-1
  product_data_path: "PC collector -> normalized snapshots -> transport -> ESP32 receiver/cache/stale -> LCD GUI"

target:
  board: waveshare-esp32-s3-lcd-3.16
  framework: esp-idf
  framework_version: 5.3.2
  hardware_profile: docs/hardware/version-2-capabilities.md

inputs:
  purpose: docs/PROJECT_PURPOSE.md
  environment: docs/DEVELOPMENT_ENVIRONMENT.md
  protocol: docs/experiments/hardware-feature-discovery.md
  prompt: experiments/prompts/version-2-agent-task.md
  readiness: docs/experiments/benchmark-readiness.md
  feature_comparison: docs/experiments/feature-comparison.md
  evaluation_contract: docs/experiments/evaluation-contract.md
  integration_contract: docs/experiments/integration-contract.md

run_policy:
  same_base_commit: true
  isolated_branch_or_worktree: true
  preserve_prompt_and_attempted_followups_as_evidence: true
  one_shot_primary_cohort: true
  followups_allowed: false
  external_feedback_allowed: false
  evaluator_read_only: true
  preserve_failed_runs: true
  public_reference_access: fixed_by_run
  credentialed_private_data_access: forbidden
  pilot_runs_per_surface: 1
  repetitions_per_agent_model: 3
  randomized_run_order: true
  hard_timeout_seconds: 7200
  hardware_runs_are_serial: true
  agent_flash_erase_allowed: false

comparison_surfaces:
  - provider: recorded_in_profile
    product: opencode-cli
    interface: cli
    included: conditional
  - provider: openai
    product: codex-cli
    interface: cli
    included: true
  # gemini-cli: Google이 2026-06-18부터 개인 계정 요청을 중단하고 Antigravity CLI로
  # 전환. Enterprise/API 키 조건에서만 실행 가능하므로 conditional. 기본 비교군은 antigravity-cli.
  - provider: google
    product: gemini-cli
    interface: cli
    included: conditional
  - provider: google
    product: antigravity-cli
    interface: cli
    included: conditional
  - provider: google
    product: antigravity-ide
    interface: ide
    included: separate_interactive_group
  - provider: openai
    product: chatgpt-web
    interface: web
    included: false

data_sources:
  # Multi-provider fixture matrix (fixed input candidate; hash freeze pending):
  # experiments/fixtures/provider-fixture-matrix.json
  personal_usage: experiments/fixtures/personal-usage.json
  # codex_reset_forecast: parser-compat-only, not_for_display (ADR-0006)
  codex_reset_forecast: experiments/fixtures/codex-reset-forecast.json
  codex_resets_history: experiments/fixtures/codex-resets-history.json
  live_api_allowed_after_fixture: true
  live_api_requires_source_url_and_response_hash: true
  pc_collector: fixture-provider-registry
  transport: usb-serial-cdm-1
  receiver: production-firmware-required

core_requirements:
  contract: docs/PRODUCT_CONTRACT.md
  required_ids: [C1, C2, C3, C4, C5, C6, C7, C8]
  c3_scope: pc-fixture-to-esp32-display
  cohort_product_pass_eligible: true
  all_must_pass_for_prep_completion: true

planned_product_integration_requirements:
  contract: docs/PRODUCT_CONTRACT.md
  required_ids: [I1, I2, I3, I4]
  applies_to: version-2-end-to-end-v1
  all_must_pass_for_product_pass: true

autonomous_hardware_feature:
  enabled: true
  candidate_count: 3
  implementation_count: 1
  selection_owner: agent
  external_hardware_allowed: false
  may_replace_core_requirements: false
  user_choice_required: false
  record_rejected_candidates: true
  require_build_verification: true
  require_hardware_test_plan: true
  score_separately_from_core: true

measurement:
  wall_clock_time: required
  tool_and_command_count: required
  failed_command_count: required
  user_intervention_count: required
  token_usage: components_when_available
  hardware_discovery_phase_metrics: when_available
  provider_reported_tokens_are_not_cross_provider_ranked: true
  report_median_and_range: true

outputs:
  manifest: results/<run-id>/run-manifest.json
  selection_document: docs/agent-runs/<run-id>/hardware-feature-selection.md
  structured_result: results/<run-id>/end-to-end-result.json
  command_log: results/<run-id>/commands.jsonl

validation:
  command: python scripts/validate-end-to-end-result.py --result <result> --manifest <e2e-evaluation-manifest> --evidence-root <evidence-root>
  example_command: python scripts/validate-experiment-result.py
  feature_and_gui_fields_required_before_new_baseline: true
  integration_fields_required_before_product_benchmark: true
